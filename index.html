<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GCACW Combat Calculator</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; background-color: #f4f4f9; color: #333; }
    .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label { font-weight: bold; font-size: 0.9em; display: block; margin-top: 8px; }
    input, select { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    button { width: 100%; background: #007aff; color: white; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; margin-top: 15px; }
    .result-box { background: #eef6ff; border-left: 4px solid #007aff; padding: 10px; margin-top: 15px; }
  </style>
</head>
<body>

  <h2>GCACW Combat Resolver</h2>

  <div class="card">
    <h3>Attacker (Union)</h3>
    <div class="grid">
      <div><label>Combat Value (CV)</label><input type="number" id="attCV" value="25"></div>
      <div><label>Artillery</label><input type="number" id="attArty" value="7"></div>
    </div>
    <div class="grid">
      <div><label>Tactical Rating</label><input type="number" id="attTac" value="2"></div>
      <div>
        <label>Action Type</label>
        <select id="actionType">
          <option value="assault">Assault (+1)</option>
          <option value="march">March</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>Defender (CSA)</h3>
    <div class="grid">
      <div><label>Combat Value (CV)</label><input type="number" id="defCV" value="11"></div>
      <div><label>Artillery</label><input type="number" id="defArty" value="3"></div>
    </div>
    <div class="grid">
      <div><label>Tactical Rating</label><input type="number" id="defTac" value="3"></div>
      <div>
        <label>Terrain</label>
        <select id="terrain">
          <option value="clear">Clear</option>
          <option value="rough">Rough / Hill</option>
          <option value="mountain">Mountain</option>
        </select>
      </div>
    </div>
    <label>Hexside Feature</label>
    <select id="hexside">
      <option value="creek">Creek (+1 Def)</option>
      <option value="none">None</option>
      <option value="bridge">Bridge / Ford (+2 Def)</option>
    </select>
  </div>

  <button onclick="runCalculation()">Calculate Modifiers</button>

  <div id="output" class="card result-box" style="display:none;"></div>

  <script src="calculator.js"></script>
  <script>
    function runCalculation() {
      const params = {
        attackerCV: parseFloat(document.getElementById('attCV').value),
        defenderCV: parseFloat(document.getElementById('defCV').value),
        attackerArty: parseFloat(document.getElementById('attArty').value),
        defenderArty: parseFloat(document.getElementById('defArty').value),
        attackerTactical: parseFloat(document.getElementById('attTac').value),
        defenderTactical: parseFloat(document.getElementById('defTac').value),
        actionType: document.getElementById('actionType').value,
        terrain: document.getElementById('terrain').value,
        hexside: document.getElementById('hexside').value
      };

      const res = calculateCombat(params);
      
      let html = `<b>Net Differential: ${res.netDiff >= 0 ? '+' : ''}${res.netDiff}</b><br><br><b>Breakdown:</b><ul>`;
      res.breakdown.forEach(item => html += `<li>${item}</li>`);
      html += `</ul>`;

      const out = document.getElementById('output');
      out.innerHTML = html;
      out.style.display = 'block';
    }
  </script>
</body>
</html>
